<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChronosAI — Food Inventory Optimization Platform</title>
  <meta name="description" content="AI-powered perishable food inventory management: track batches, monitor expiry, and act on intelligent redistribution and reorder recommendations." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

<!-- ═══════════════════════════════ SIDEBAR ═══════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-name" style="font-family: var(--font-serif); font-size: 22px; font-weight: 500; letter-spacing: -0.5px; color: #e8e6e3;">Chronos</div>
  </div>

  <nav class="sidebar-nav" role="navigation" aria-label="Main navigation">
    <a class="nav-item active" href="#dashboard"       id="nav-dashboard">
      <span class="nav-icon"><i data-feather="grid" style="width: 16px; height: 16px;"></i></span> Dashboard
    </a>
    <a class="nav-item" href="#inventory"              id="nav-inventory">
      <span class="nav-icon"><i data-feather="box" style="width: 16px; height: 16px;"></i></span> Inventory
    </a>
    <a class="nav-item" href="#recommendations"        id="nav-recommendations">
      <span class="nav-icon"><i data-feather="cpu" style="width: 16px; height: 16px;"></i></span> AI Recommendations
      <span class="nav-badge" id="rec-badge" style="display:none"></span>
    </a>
    <a class="nav-item" href="#operations"             id="nav-operations">
      <span class="nav-icon"><i data-feather="refresh-cw" style="width: 16px; height: 16px;"></i></span> Operations
    </a>
    <div class="nav-divider"></div>
    <a class="nav-item" href="#products"               id="nav-products">
      <span class="nav-icon"><i data-feather="shopping-bag" style="width: 16px; height: 16px;"></i></span> Products
    </a>
    <a class="nav-item" href="#warehouses"             id="nav-warehouses">
      <span class="nav-icon"><i data-feather="map-pin" style="width: 16px; height: 16px;"></i></span> Warehouses
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="footer-status" id="footer-status">
      <div class="status-dot"></div>
      <span>Connected</span>
    </div>
    <div class="footer-version">v2.0 · Real Data Mode</div>
    <div style="margin-top: 12px;">
      <button class="btn btn-sm btn-ghost" onclick="resetDatabase()" style="width:100%; border:1px solid var(--border-color); color:var(--text-muted)">Reset Mock DB</button>
    </div>
  </div>
</aside>

<!-- ═══════════════════════════════ MAIN ══════════════════════════ -->
<main class="main-area" id="main-area">
  <div class="main-content" id="main-content">
    <!-- Pages render here -->
    <div class="page-loading">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>
  </div>
</main>

<!-- ═══════════════════════════════ MODAL ═════════════════════════ -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">Modal</h2>
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ═══════════════════════════════ TOASTS ════════════════════════ -->
<div class="toast-container" id="toast-container" aria-live="polite"></div>

<script src="/static/app.js"></script>
<script>
  // Initial feather icon replacement
  feather.replace();
  
  // Re-run feather replacement whenever page content changes
  const observer = new MutationObserver(function() {
    feather.replace();
  });
  observer.observe(document.getElementById('main-content'), { childList: true, subtree: true });
</script>
</body>
</html>
